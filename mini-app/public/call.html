<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Позвонить в Si Phone</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #f5f5f7; --muted: #8e8e93; } }
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--text); text-align: center;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: var(--muted); font-size: 15px; }
  a.call { display: block; min-width: 240px; padding: 14px 20px; border-radius: 14px; background: #7ED957; color: #102A07;
    font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<h1>Si Phone</h1>
<p id="hint">Сейчас откроется звонок</p>
<a class="call" id="call" href="#">Позвонить</a>
<p>Потом закройте эту страницу — магазин останется открытым в Telegram.</p>
<script src="/call.js"></script>
</body>
</html>
