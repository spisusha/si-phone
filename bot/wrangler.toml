# Конфиг Cloudflare Workers
# https://developers.cloudflare.com/workers/

name = "si-phone-bot"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Публичные переменные (не секреты)
[vars]
MINI_APP_URL = "https://si-phone.vercel.app/"

# KV для хранения истории диалогов (последние 8 сообщений на пользователя)
[[kv_namespaces]]
binding = "KV"
id = "1cf8aedc7538453988ffd1d59d155f0c"
preview_id = "c659c4ff97574d04bc4407b36b9e4374"

# Секреты (в репозиторий не кладём): TELEGRAM_BOT_TOKEN, GEMINI_API_KEY, WEBHOOK_SECRET,
# ADMIN_CHAT_ID — chat_id админов через запятую (кто может /addreview и получает уведомления).
# Задать: npx wrangler secret put ИМЯ
